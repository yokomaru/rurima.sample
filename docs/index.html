<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>るりまガチャ</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <main class="top-page">
      <section id="top-screen">
        <header class="hero">
          <h1>るりまガチャ <span>Ruby 4.0</span></h1>
          <p>
            Rubyリファレンスマニュアル（通称るりま）から<br>
            ランダムにメソッドを表示します。<br>
            知らなかった便利なメソッドに出会えるかも
          </p>
          <p class="note">※ Ruby本体に組み込まれ、requireなしで使えるクラス・モジュールのメソッドから選ばれます</p>
        </header>

        <section class="draw-section" aria-label="ガチャ">
          <button type="button" id="draw-button">ガチャを引く</button>
        </section>
      </section>

      <section id="result-screen" hidden aria-labelledby="method-name">
        <p class="result-label">今日のメソッド</p>
        <h2 id="method-name"></h2>
        <p id="description"></p>
        <pre id="example"></pre>
        <p><a id="rurema-url" target="_blank" rel="noreferrer">るりまで詳しく見る</a></p>
        <button type="button" id="draw-again-button">もう一度引く</button>
      </section>

      <section class="history-section" aria-labelledby="history-title">
        <h2 id="history-title">ガチャ履歴</h2>
        <ul id="history-list"></ul>
      </section>
    </main>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
